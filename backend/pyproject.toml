[project]
name = "betauia-backend"
version = "0.1.0"
description = "Backend for betauia.net"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.128.5",
    "fastapi-mail>=1.6.1",
    "icalendar>=6.3.1",
    "pillow>=12.1.1",
    "psycopg2-binary>=2.9.11", # Used by alembic for migrations
    "pydantic[email]>=2.12.5",
    "python-dotenv>=1.2.1",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.22", # Needed by FastAPI for file uploads and forms
    "recurring-ical-events>=3.8.0",
    "requests>=2.32.5",
    "slowapi>=0.1.9",
    "sqlalchemy[asyncio]>=2.0.46",
    "uvicorn[standard]>=0.40.0",
]

[dependency-groups]
dev = ["ruff>=0.14.0"]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["alembic/versions"] # Generated by alembic

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "PT", "PL"]
ignore = [
    "E501",
    "PLR0913", # FastAPI forms need one argument per field
    "PLR0917",
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
